min_version = "2025.8.0"

[tools]
python = "3.13.14"
uv = "0.12.5"

[env]
PYTHONPATH = "src"

[tasks.test]
description = "Validate the plugin package, host docs, and public-repo boundary"
run = [
  "python scripts/check.py",
  "uvx check-jsonschema --schemafile https://agent-plugins.org/schemas/1.0.0/plugin.schema.json packages/attenza-plugin/plugin.json",
  "uvx check-jsonschema --schemafile https://agent-plugins.org/schemas/1.0.0/mcp.schema.json packages/attenza-plugin/mcp.json",
  "python -m unittest discover -s tests",
]

[tasks.build]
description = "Build source and wheel distributions for the Attenza CLI"
run = "uv build"

[tasks.check]
description = "Run the complete repository quality gate"
depends = ["test", "build"]
