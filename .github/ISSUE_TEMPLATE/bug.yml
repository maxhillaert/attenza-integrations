name: Integration bug
description: Report a reproducible problem with an existing Attenza integration.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, OAuth codes, private capability URLs, personal task data, or other secrets. Report security issues privately through the Security tab."
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Cursor
        - GrokBot
        - Attenza CLI
        - Portable Agent Plugin
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package and host version
      placeholder: "Attenza 0.1.0; host version 1.2.3"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction with synthetic data
      description: Describe what you did, what happened, and what you expected.
    validations:
      required: true
