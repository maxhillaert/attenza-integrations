name: New platform
description: Propose support for another agent platform or marketplace.
title: "[Platform]: "
labels: [integration]
body:
  - type: input
    id: platform
    attributes:
      label: Platform
    validations:
      required: true
  - type: input
    id: docs
    attributes:
      label: Official integration documentation
      placeholder: "https://..."
    validations:
      required: true
  - type: textarea
    id: oauth
    attributes:
      label: Remote MCP and OAuth support
      description: Explain the documented installation, OAuth, and publication path.
    validations:
      required: true
